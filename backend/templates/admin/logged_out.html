{% load static %}

<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Déconnexion — Gestion des Stages
    </title>


    <link rel="stylesheet"
          href="{% static 'admin/css/base.css' %}">


    <link rel="stylesheet"
          href="{% static 'admin/css/custom_admin.css' %}">


    <style>

        /* =====================================================
           PAGE DE DÉCONNEXION
        ===================================================== */

        body.logout-page {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #f4f8fc 0%,
                    #eaf3fb 100%
                );

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

        }


        .logout-container {

            width: 100%;

            max-width: 480px;

            padding: 20px;

        }


        /* =================================================
           CARTE
        ================================================= */

        .logout-card {

            padding:
                45px 40px;

            background:
                #ffffff;

            border:
                1px solid #e0e8f0;

            border-radius:
                18px;

            box-shadow:
                0 20px 50px
                rgba(28, 65, 100, 0.12);

            text-align:
                center;

        }


        /* =================================================
           ICÔNE
        ================================================= */

        .logout-icon {

            width: 75px;

            height: 75px;

            margin:
                0 auto 25px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius:
                50%;

            background:
                #eaf5fd;

            color:
                #1767b1;

        }


        .logout-icon svg {

            width: 38px;

            height: 38px;

            stroke:
                currentColor;

        }


        /* =================================================
           LOGO / NOM
        ================================================= */

        .logout-brand {

            margin-bottom:
                25px;

            color:
                #1767b1;

            font-size:
                14px;

            font-weight:
                700;

            letter-spacing:
                .5px;

        }


        .logout-brand span {

            display:
                block;

            margin-top:
                4px;

            color:
                #8a9aaa;

            font-size:
                11px;

            font-weight:
                400;

        }


        /* =================================================
           TITRE
        ================================================= */

        .logout-card h1 {

            margin:
                0 0 10px;

            color:
                #183957;

            font-size:
                25px;

            font-weight:
                700;

        }


        /* =================================================
           TEXTE
        ================================================= */

        .logout-message {

            margin:
                0 auto 28px;

            max-width:
                350px;

            color:
                #718399;

            font-size:
                14px;

            line-height:
                1.7;

        }


        .logout-message strong {

            color:
                #405d77;

            font-weight:
                600;

        }


        /* =================================================
           BOUTON
        ================================================= */

        .login-again {

            width:
                100%;

            min-height:
                46px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                9px;

            padding:
                11px 20px;

            border:
                none;

            border-radius:
                9px;

            background:
                linear-gradient(
                    135deg,
                    #1976c5,
                    #145b9b
                );

            color:
                #ffffff;

            font-size:
                14px;

            font-weight:
                600;

            text-decoration:
                none;

            box-shadow:
                0 7px 18px
                rgba(23, 103, 177, 0.25);

            transition:
                all .2s ease;

        }


        .login-again:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 22px
                rgba(23, 103, 177, 0.32);

            color:
                #ffffff;

        }


        .login-again svg {

            width:
                18px;

            height:
                18px;

            stroke:
                currentColor;

        }


        /* =================================================
           PETIT TEXTE
        ================================================= */

        .logout-footer {

            margin-top:
                25px;

            padding-top:
                20px;

            border-top:
                1px solid #edf1f5;

            color:
                #9aa8b6;

            font-size:
                11px;

        }


        /* =================================================
           RESPONSIVE
        ================================================= */

        @media (max-width: 520px) {

            .logout-container {

                padding:
                    15px;

            }


            .logout-card {

                padding:
                    35px 25px;

                border-radius:
                    14px;

            }


            .logout-card h1 {

                font-size:
                    22px;

            }

        }

    </style>

</head>


<body class="logout-page">


<div class="logout-container">


    <div class="logout-card">


        <!-- =================================================
             LOGO
        ================================================== -->

        <div class="logout-brand">

            GESTION DES STAGES

            <span>
                Administration
            </span>

        </div>



        <!-- =================================================
             ICÔNE SUCCÈS
        ================================================== -->

        <div class="logout-icon">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <path d="M20 6L9 17l-5-5"/>

            </svg>

        </div>



        <!-- =================================================
             TITRE
        ================================================== -->

        <h1>
            Déconnexion réussie
        </h1>



        <!-- =================================================
             MESSAGE
        ================================================== -->

        <p class="logout-message">

            Vous avez été déconnecté de votre
            <strong>
                espace d'administration
            </strong>
            en toute sécurité.

            <br>

            Merci pour votre visite.

        </p>



        <!-- =================================================
             BOUTON CONNEXION
        ================================================== -->

        <a href="{% url 'admin:login' %}"
           class="login-again">


            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>

                <polyline points="10 17 15 12 10 7"/>

                <line x1="15"
                      y1="12"
                      x2="3"
                      y2="12"/>

            </svg>


            Se reconnecter


        </a>



        <!-- =================================================
             FOOTER
        ================================================== -->

        <div class="logout-footer">

            Gestion des Stages
            •
            Espace sécurisé d'administration

        </div>


    </div>


</div>


</body>

</html>
